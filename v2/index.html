<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Voice demo test (v2) | Swim School Owners Hub</title>
<style>
body{margin:0;background:#eef4fb;font-family:Lato,Helvetica,Arial,sans-serif;color:#1a305c}
.wrap{max-width:480px;margin:0 auto;padding:32px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,15,53,.07);overflow:hidden}
.bar{height:6px;background:linear-gradient(90deg,#245ea3 0%,#00acd7 50%,#27bcbb 100%)}
.inner{padding:28px 24px 32px;text-align:center}
img{width:110px;height:auto}
h1{margin:16px 0 6px;font-size:20px;color:#000f35}
.tag{display:block;width:fit-content;margin:14px auto 4px;padding:4px 10px;border-radius:999px;background:#e4f4f4;color:#12797a;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
p{margin:0 0 20px;font-size:15px;line-height:1.6}
.note{font-size:13px;color:#5a6b8c;margin:22px 0 0;line-height:1.5}
.widget{min-height:260px}
</style></head>
<body><div class="wrap"><div class="card"><div class="bar"></div><div class="inner">
<img alt="Swim School Owners Hub" src="https://assets.cdn.filesafe.space/qDnicuftnLuI6byy60fe/media/c77d7db4-7ae4-406b-8def-c88059be6721.png">
<div class="tag">v2 test</div>
<h1>Voice demo test page</h1>
<p>Tap <strong>the call button</strong>, allow your microphone, then just talk.</p>
<div class="widget">
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6aaf2abe599f010aec33016f"></script>
</div>
<p class="note">This is the test version, separate from the booth demo. Nothing here touches the live agents, and it doesn't send the demo email.</p>
</div></div></div><script>
setInterval(function () {
  var el = document.querySelector('chat-widget');
  if (!el) return;
  try { el.showAgencyBranding = false; } catch (e) {}
  var sr = el.shadowRoot;
  if (sr && !sr.getElementById('ssoh-tidy')) {
    var st = document.createElement('style');
    st.id = 'ssoh-tidy';
    st.textContent = '.lc_text-widget--agency-branding,.lc_text-widget--embedded-live-chat-footer{display:none!important}';
    sr.appendChild(st);
  }
}, 700);
</script>
</body></html>
